# MangoHud — hacker HUD for arch-station
# toggle overlay: Right Shift + F12

legacy_layout=false
position=top-left
background_alpha=0.35
background_color=020202
round_corners=0
font_file=/usr/share/fonts/TTF/JetBrainsMonoNerdFont-Regular.ttf
font_size=22
text_color=D8F8D8
hud_compact

# GPU — RX 9060 XT
gpu_text=GPU
gpu_stats
gpu_temp
gpu_power
gpu_core_clock
vram
gpu_color=39FF14
vram_color=39FF14
gpu_load_change
gpu_load_value=60,90
gpu_load_color=39FF14,FFD700,FF3131

# CPU — Ryzen 5 7600
cpu_text=CPU
cpu_stats
cpu_temp
cpu_mhz
cpu_color=FF3EB5
cpu_load_change
cpu_load_value=60,90
cpu_load_color=39FF14,FFD700,FF3131

ram
ram_color=00E5FF

# FPS color shifts red -> gold -> neon green as it climbs
fps
fps_value=30,60
fps_color_change
fps_color=FF3131,FFD700,39FF14
frame_timing=1
frametime_color=39FF14
engine_color=00E5FF
wine
gamemode

toggle_hud=Shift_R+F12
