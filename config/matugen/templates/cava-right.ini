[general]
framerate = 60
autosens = 1
bars = 0
bar_width = 3
bar_spacing = 1

[input]
method = pulse
source = auto

[output]
channels = mono
mono_option = right

[color]
gradient = 1
gradient_count = 6
gradient_color_1 = '{{colors.primary.default.hex}}'
gradient_color_2 = '{{colors.secondary.default.hex}}'
gradient_color_3 = '{{colors.tertiary.default.hex}}'
gradient_color_4 = '{{colors.primary_container.default.hex}}'
gradient_color_5 = '{{colors.secondary_container.default.hex}}'
gradient_color_6 = '{{colors.tertiary_container.default.hex}}'

[smoothing]
noise_reduction = 88
monstercat = 1
waves = 0
gravity = 100
