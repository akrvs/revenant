# Hyprland Keybinds
# See https://wiki.hyprland.org/Configuring/Binds/

$mainMod = SUPER

# Directories
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts

# ========== CORE WINDOW MANAGEMENT ========== #
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, Q, exec, $scriptsDir/KillActiveProcess.sh
bind = $mainMod ALT, F, exec, hyprctl dispatch workspaceopt allfloat

# Logout menu
bind = $mainMod, Escape, exec, $scriptsDir/Wlogout.sh  # Logout menu (single bind)

# ========== FEATURES & TOOLS ========== #
bind = $mainMod ALT, R, exec, $scriptsDir/Refresh.sh # Refresh waybar, swaync, rofi
bind = $mainMod SHIFT, G, exec, $scriptsDir/GameMode.sh # Toggle animations ON/OFF
bind = $mainMod ALT, L, exec, $scriptsDir/ChangeLayout.sh # Toggle Master or Dwindle Layout
bind = $mainMod SHIFT, N, exec, dunstctl history-pop # Recall last notification
bind = $mainMod CTRL, N, exec, dunstctl close-all # Dismiss all notifications
bind = $mainMod ALT, N, exec, dunstctl set-paused toggle # Toggle Do Not Disturb
bind = $mainMod, A, exec, $scriptsDir/WindowSwitcher.sh # Window switcher (rofi)

# Wallpaper
bind = CTRL ALT, W, exec, $UserScripts/WallpaperRandom.sh # Random wallpaper

# Online music streaming
#bind = $mainMod SHIFT, M, exec, $UserScripts/RofiBeats.sh

# ========== LAYOUT CONTROLS ========== #
# Master Layout
bind = $mainMod CTRL, D, layoutmsg, removemaster
bind = $mainMod, I, layoutmsg, addmaster
bind = $mainMod, J, layoutmsg, cyclenext
bind = $mainMod, K, layoutmsg, cycleprev
bind = $mainMod CTRL, Return, layoutmsg, swapwithmaster

# Group
bind = $mainMod CTRL, tab, changegroupactive

# Cycle windows (ALT+TAB behavior)
bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop

# ========== MEDIA KEYS ========== #
# Volume
bindel = , xf86audioraisevolume, exec, $scriptsDir/Volume.sh --inc
bindel = , xf86audiolowervolume, exec, $scriptsDir/Volume.sh --dec
bindl = , xf86AudioMicMute, exec, $scriptsDir/Volume.sh --toggle-mic
bindl = , xf86audiomute, exec, $scriptsDir/Volume.sh --toggle

# Media controls
bindl = , xf86AudioPlayPause, exec, $scriptsDir/MediaCtrl.sh --pause
bindl = , xf86AudioPause, exec, $scriptsDir/MediaCtrl.sh --pause
bindl = , xf86AudioPlay, exec, $scriptsDir/MediaCtrl.sh --pause
bindl = , xf86AudioNext, exec, $scriptsDir/MediaCtrl.sh --nxt
bindl = , xf86AudioPrev, exec, $scriptsDir/MediaCtrl.sh --prv
bindl = , xf86audiostop, exec, $scriptsDir/MediaCtrl.sh --stop

# ========== SCREENSHOT ========== #
bind = $mainMod, Print, exec, $scriptsDir/ScreenShot.sh --now
bind = $mainMod CTRL, Print, exec, $scriptsDir/ScreenShot.sh --in5
bind = $mainMod CTRL SHIFT, Print, exec, $scriptsDir/ScreenShot.sh --in10
bind = ALT, Print, exec, $scriptsDir/ScreenShot.sh --active
bind = $mainMod SHIFT, S, exec, $scriptsDir/ScreenShot.sh --swappy

# ========== WINDOW RESIZING ========== #
# (Super+Shift+P duplicate screenshot removed — use Super+Print)
binde = $mainMod SHIFT, left, resizeactive,-50 0
binde = $mainMod SHIFT, right, resizeactive,50 0
binde = $mainMod SHIFT, up, resizeactive,0 -50
binde = $mainMod SHIFT, down, resizeactive,0 50

# ========== WINDOW MOVEMENT ========== #
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d

# ========== FOCUS MOVEMENT ========== #
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ========== WORKSPACE MANAGEMENT ========== #
# Cycle through workspaces
bind = $mainMod, tab, workspace, m+1
bind = $mainMod SHIFT, tab, workspace, m-1

# Special workspace (scratchpad)
bind = $mainMod SHIFT, U, movetoworkspace, special
# bind = $mainMod, U, togglespecialworkspace,  # Disabled - U is now for thunar

# Switch to workspace [1-10]
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod, code:19, workspace, 10

# Move window to workspace [1-10]
bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8
bind = $mainMod SHIFT, code:18, movetoworkspace, 9
bind = $mainMod SHIFT, code:19, movetoworkspace, 10
bind = $mainMod SHIFT, bracketleft, movetoworkspace, -1
bind = $mainMod SHIFT, bracketright, movetoworkspace, +1

# Move window to workspace silently [1-10]
bind = $mainMod CTRL, code:10, movetoworkspacesilent, 1
bind = $mainMod CTRL, code:11, movetoworkspacesilent, 2
bind = $mainMod CTRL, code:12, movetoworkspacesilent, 3
bind = $mainMod CTRL, code:13, movetoworkspacesilent, 4
bind = $mainMod CTRL, code:14, movetoworkspacesilent, 5
bind = $mainMod CTRL, code:15, movetoworkspacesilent, 6
bind = $mainMod CTRL, code:16, movetoworkspacesilent, 7
bind = $mainMod CTRL, code:17, movetoworkspacesilent, 8
bind = $mainMod CTRL, code:18, movetoworkspacesilent, 9
bind = $mainMod CTRL, code:19, movetoworkspacesilent, 10
bind = $mainMod CTRL, bracketleft, movetoworkspacesilent, -1
bind = $mainMod CTRL, bracketright, movetoworkspacesilent, +1

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, period, workspace, e+1
bind = $mainMod, comma, workspace, e-1

# Custom Volume Keys
bind = $mainMod, equal, exec, $scriptsDir/Volume.sh --inc
bind = $mainMod, minus, exec, $scriptsDir/Volume.sh --dec
bind = $mainMod, m, exec, $scriptsDir/Volume.sh --toggle
