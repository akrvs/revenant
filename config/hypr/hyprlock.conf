# ─────────────────────────────────────────────
#  hyprlock — minimal centered terminal lock
# ─────────────────────────────────────────────

background {
    monitor =
    color = rgba(6, 7, 9, 1.0)
}

general {
    hide_cursor = false
    ignore_empty_input = true
}

# ── clock ──
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(208, 217, 213, 0.92)
    font_size = 88
    font_family = JetBrainsMono Nerd Font
    position = 0, 130
    halign = center
    valign = center
}

# ── shell prompt line ──
label {
    monitor =
    text = akrvs@arch-station ~ %  locked
    color = rgba(80, 250, 123, 0.85)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

# ── password field: borderless terminal input ──
input-field {
    monitor =
    size = 300, 44
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(6, 7, 9, 0)
    inner_color = rgba(6, 7, 9, 0)
    font_color = rgba(80, 250, 123, 0.95)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##50fa7b">▸ password_</span>
    hide_input = false
    check_color = rgba(80, 250, 123, 0.95)
    fail_color = rgba(255, 85, 85, 0.95)
    fail_text = <span foreground="##ff5555">access denied ($ATTEMPTS)</span>
    rounding = 0
    position = 0, -55
    halign = center
    valign = center
}
