# Window Rules Configuration - Hyprland 0.53+ syntax
# See https://wiki.hypr.land/Configuring/Window-Rules/

# ========== TAGS ========== #
# Browser
windowrule = match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$, tag +browser

# Notifications
windowrule = match:class ^(swaync-control-center|swaync-notification-window|swaync-client)$, tag +notif

# Terminal
windowrule = match:class ^(Alacritty|kitty|kitty-dropterm)$, tag +terminal

# Development (JetBrains IDEs)
windowrule = match:class ^(jetbrains-.+)$, tag +projects
windowrule = match:class ^([Oo]bsidian|md\.obsidian\.Obsidian)$, tag +projects
windowrule = match:class ^([Aa]ntigravity)$, tag +projects

# Screen recording/streaming
windowrule = match:class ^(com.obsproject.Studio)$, tag +screenshare

# Instant Messaging (Discord)
windowrule = match:class ^([Ww]ebCord|[Vv]esktop)$, tag +im

# Games
windowrule = match:class ^(gamescope)$, tag +games
windowrule = match:class ^(steam_app_\d+)$, tag +games

# Game stores (Steam, Lutris, Heroic)
windowrule = match:class ^([Ss]team)$, tag +gamestore
windowrule = match:title ^([Ll]utris)$, tag +gamestore
windowrule = match:class ^(com.heroicgameslauncher.hgl)$, tag +gamestore

# File managers
windowrule = match:class ^([Tt]hunar|org.gnome.Nautilus|[Pp]cmanfm-qt)$, tag +file-manager
windowrule = match:class ^(app.drey.Warp)$, tag +file-manager

# Multimedia video players
windowrule = match:class ^([Mm]pv|vlc)$, tag +multimedia_video

# System settings
windowrule = match:class ^(file-roller|org.gnome.FileRoller)$, tag +settings
windowrule = match:class ^(nm-applet|nm-connection-editor|blueman-manager)$, tag +settings
windowrule = match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$, tag +settings
windowrule = match:class ^(qt5ct|qt6ct|[Yy]ad)$, tag +settings
windowrule = match:class (xdg-desktop-portal-gtk), tag +settings
windowrule = match:class ^(org.kde.polkit-kde-authentication-agent-1)$, tag +settings
windowrule = match:class ^([Rr]ofi)$, tag +settings

# Viewers (image, document, system monitor)
windowrule = match:class ^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter.MissionCenter)$, tag +viewer
windowrule = match:class ^(evince)$, tag +viewer
windowrule = match:class ^(eog|org.gnome.Loupe|imv-dir)$, tag +viewer

# Special overrides for video players
windowrule = match:tag multimedia_video, no_blur on
windowrule = match:tag multimedia_video, opacity 1.0

# ========== WORKSPACE ASSIGNMENTS ========== #
# Minimal setup - apps open anywhere (user prefers manual management)

# Waybar calendar popup - positioned just below center of bar
# Volume slider popup
windowrule = match:title ^(VolumeSlider)$, float on
windowrule = match:title ^(VolumeSlider)$, size 280 50

windowrule = match:title ^(WaybarCalendar)$, float on
windowrule = match:title ^(WaybarCalendar)$, move 1160 45
windowrule = match:title ^(WaybarCalendar)$, size 280 280

# Fastfetch terminal - large left
windowrule = match:title ^(System Info)$, float on

windowrule = match:title ^(System Info)$, move 60 60

# Cava visualizer - floating window
windowrule = match:title ^(Cava Audio Visualizer)$, float on
windowrule = match:title ^(Cava Audio Visualizer)$, size 700 420
windowrule = match:title ^(Cava Audio Visualizer)$, move 1300 820
windowrule = match:title ^(Cava Audio Visualizer)$, opacity 0.85 0.75

# ========== POSITIONING ========== #
windowrule = match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$, center on
windowrule = match:title ^(Picture-in-Picture)$, move 72% 7%

# Prevent idle for fullscreen apps
windowrule = match:fullscreen 1, idle_inhibit fullscreen

# cmatrix idle screensaver: no window rules — it runs as a kitty panel (layer-shell surface,
# see UserScripts/ScreensaverMatrix.sh). A regular window can't work here: mapping one counts
# as user activity in Hyprland >= 0.55 and instantly resets the idle -> lock -> suspend chain.

# ========== FLOAT RULES (Mostly floating setup) ========== #
# Most windows float by default
windowrule = match:tag settings, float on
windowrule = match:tag viewer, float on
windowrule = match:tag file-manager, float on
windowrule = match:tag im, float on
windowrule = match:class (org.gnome.Calculator), float on
windowrule = match:class ^(mpv|com.github.rafostar.Clapper)$, float on
windowrule = match:class ^([Qq]alculate-gtk)$, float on
windowrule = match:title ^(Picture-in-Picture)$, float on
# Keep browser and terminals tiled for productivity
# Force tiling for apps that would otherwise float/center
windowrule = match:class ^([Dd]iscord)$, tile on
windowrule = match:class ^(resolve)$, tile on
windowrule = match:class ^([Oo]bsidian|md\.obsidian\.Obsidian)$, tile on
windowrule = match:class ^([Aa]ntigravity)$, tile on

# Float popups and dialogues
windowrule = match:title ^(Authentication Required)$, float on
windowrule = match:title ^(Authentication Required)$, center on
windowrule = match:class ^(com.heroicgameslauncher.hgl)$, float on
windowrule = match:class ^([Ss]team)$, float on
windowrule = match:class ([Tt]hunar), float on
windowrule = match:title ^(Preview)$, float on
windowrule = match:title ^(Preview)$, size 60% 80%
windowrule = match:title ^(Add Folder to Workspace)$, float on
windowrule = match:title ^(Add Folder to Workspace)$, size 70% 60%
windowrule = match:title ^(Add Folder to Workspace)$, center on
windowrule = match:title ^(Save As)$, float on
windowrule = match:title ^(Save As)$, size 70% 60%
windowrule = match:title ^(Save As)$, center on
windowrule = match:title (Open Files), float on
windowrule = match:title (Open Files), size 70% 60%

# ========== OPACITY (More solid aesthetic) ========== #
windowrule = match:tag browser, opacity 1.0 1.0
windowrule = match:tag projects, opacity 0.95 0.90
windowrule = match:tag im, opacity 0.95 0.90
windowrule = match:tag file-manager, opacity 0.98 0.92
windowrule = match:tag terminal, opacity 0.95 0.90
windowrule = match:tag settings, opacity 0.95 0.90
windowrule = match:tag viewer, opacity 0.95 0.90
windowrule = match:title ^(Picture-in-Picture)$, opacity 1.0 0.90


# ========== SIZE RULES ========== #
windowrule = match:tag settings, size 70% 70%

# ========== PINNING ========== #
windowrule = match:title ^(Picture-in-Picture)$, pin on
windowrule = match:title ^(Picture-in-Picture)$, keep_aspect_ratio on

# ========== GAMES - NO BLUR & FULLSCREEN ========== #
windowrule = match:tag games, no_blur on
windowrule = match:tag games, fullscreen on

# ========== LAYER RULES ========== #
# General
layerrule = no_anim on, match:namespace noanim
layerrule = blur on, match:namespace gtk-layer-shell
layerrule = ignore_alpha 0.0, match:namespace gtk-layer-shell

# Waybar
layerrule = blur on, match:namespace waybar
# layerrule = blur_popups on, match:namespace waybar
layerrule = ignore_alpha 0.0, match:namespace waybar
layerrule = ignore_alpha 0.55, match:namespace waybar

# Notifications (dunst) — namespace is "notifications"
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0.0, match:namespace notifications
layerrule = animation slide, match:namespace notifications

# SwayNC (disabled — switched to dunst)
#layerrule = blur on, match:namespace swaync-control-center
#layerrule = blur on, match:namespace swaync-notification-window
#layerrule = ignore_alpha 0.0, match:namespace swaync-control-center
#layerrule = ignore_alpha 0.0, match:namespace swaync-notification-window
#layerrule = animation popin 80%, match:namespace swaync-control-center
#layerrule = animation slide, match:namespace swaync-notification-window

# Rofi
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.0, match:namespace rofi

# Logout dialog
layerrule = blur on, match:namespace logout_dialog

# Cava Stereo Split Visualizer (Left)
windowrule = match:title ^(cava-left-bg)$, float on
windowrule = match:title ^(cava-left-bg)$, size 45% 25%
windowrule = match:title ^(cava-left-bg)$, move 2% 72%
windowrule = match:title ^(cava-left-bg)$, pin on
windowrule = match:title ^(cava-left-bg)$, border_size 0
windowrule = match:title ^(cava-left-bg)$, opacity 0.98 0.98

# Cava Stereo Split Visualizer (Right)
windowrule = match:title ^(cava-right-bg)$, float on
windowrule = match:title ^(cava-right-bg)$, size 45% 25%
windowrule = match:title ^(cava-right-bg)$, move 53% 72%
windowrule = match:title ^(cava-right-bg)$, pin on
windowrule = match:title ^(cava-right-bg)$, border_size 0
windowrule = match:title ^(cava-right-bg)$, opacity 0.98 0.98



# ========== WORKSPACE 1 :: NOC GRID ========== #
# Wall of TUI panels launched by UserScripts/WS1Dashboard.sh.
# Top-heavy layout on 2560x1440 (waybar ~40px top):
#   top row (big): btop | amdgpu_top
#   ncspot        : full-width band below
#   cava          : full-width strip at the very bottom (only while music plays)

# common styling for every NOC panel
windowrule = match:title ^(noc-.*)$, workspace 1
windowrule = match:title ^(noc-.*)$, float on
windowrule = match:title ^(noc-.*)$, border_size 2
windowrule = match:title ^(noc-.*)$, rounding 0
windowrule = match:title ^(noc-.*)$, opacity 0.92 0.88

# top row — btop (left) / amdgpu_top (right), tall (top-heavy)
windowrule = match:title ^(noc-btop)$, size 1256 770
windowrule = match:title ^(noc-btop)$, move 16 52
windowrule = match:title ^(noc-gpu)$, size 1256 770
windowrule = match:title ^(noc-gpu)$, move 1288 52

# ncspot — full-width music band
windowrule = match:title ^(noc-music)$, size 2528 422
windowrule = match:title ^(noc-music)$, move 16 838

# cava — full-width visualizer strip at the bottom (spawned on playback)
windowrule = match:title ^(noc-cava)$, size 2528 140
windowrule = match:title ^(noc-cava)$, move 16 1276
windowrule = match:title ^(noc-cava)$, no_focus on
windowrule = match:title ^(noc-cava)$, border_size 0