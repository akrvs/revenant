# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

$mainMod = SUPER
$term = kitty
$editor = nano
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
# rofi App launcher
bindr = $mainMod, $mainMod_L, exec, ~/.config/rofi/scripts/launch.sh # Tap SUPER to launch rofi

# Launch applications
bind = $mainMod, T, exec, $term  # Launch terminal (kitty)

# pyprland
bind = $mainMod SHIFT, Escape, exec, pypr toggle sysmon # Dropdown system monitor (btop)

# Omarchy theme system
bind = $mainMod SHIFT, T, exec, rice-theme-menu # Omarchy theme picker
bind = $mainMod CTRL, T, exec, rice-theme-next # Cycle Omarchy theme

# Omarchy shell (rofi stays on SUPER for apps)
bind = $mainMod ALT, Space, exec, omarchy-panel menu # Omarchy search menu
bind = $mainMod CTRL, Escape, exec, omarchy-panel menu system # Omarchy system menu (lock, suspend, restart, shutdown)

# Omarchy overlays, side by side with the rofi equivalents
bind = $mainMod, V, exec, omarchy-panel clipboard # Omarchy clipboard history
bind = $mainMod, E, exec, omarchy-panel emojis # Omarchy emoji picker
bind = $mainMod ALT, V, exec, $scriptsDir/ClipManager.sh # Rofi clipboard history (cliphist)

# Omarchy capture tools
bind = $mainMod SHIFT, X, exec, omarchy-capture-text # OCR a region into the clipboard
bind = $mainMod ALT, Q, exec, omarchy-capture-qr # Decode a QR code from a region
bind = $mainMod CTRL, R, exec, omarchy-capture-screenrecording # Start or stop screen recording

# Rofi utilities (walker's useful providers, without walker or the elephant daemon)
bind = $mainMod SHIFT, C, exec, $UserScripts/RofiCalc.sh # Calculator (qalculate)
bind = $mainMod ALT, S, exec, $scriptsDir/RofiSearch.sh # Web search
bind = $mainMod SHIFT, D, exec, $UserScripts/RofiTodo.sh # Todo list
bind = $mainMod ALT, P, exec, $UserScripts/RofiPkg.sh # Package search and install

# AI agents
bind = $mainMod SHIFT, A, exec, omarchy-panel agents # Agent plan usage panel
bind = $mainMod SHIFT CTRL, A, exec, omarchy-agent --pick # Launch the default coding agent

# Misc
bind = $mainMod ALT, O, exec, omarchy-toggle-nightlight # Toggle nightlight

# User Added Keybinds
bind = $mainMod SHIFT, O, exec, $UserScripts/ZshChangeTheme.sh # Change oh-my-zsh theme
bind = $mainMod SHIFT, I, exec, $UserScripts/mpd.sh #show-mpd
#bind = $mainMod, C, exec, $UserScripts/lobster.sh #history_show
bind = Alt, Space, exec, $UserScripts/movie.sh #movie 
#bind = $mainMod, P,exec, zathura
# For passthrough keyboard into a VM
