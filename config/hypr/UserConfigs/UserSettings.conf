# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  ##
# User Settings
# This is where you put your own settings as this will not be touched during update

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables

# Sourcing colors generated by pywal
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
#blurls = waybar
# blurls = rofi

dwindle {
  # pseudotile = yes
  preserve_split = yes
  special_scale_factor = 0.8
}

master {
  #new_is_master=1 # comment this when Hyprland release a new version or you are running the git version
  new_status=master # hyprland upstream or git version (next release maybe v0.41-2 or v0.42)
  new_on_top=1
  mfact = 0.5
}

general {
  gaps_in = 4
  gaps_out = 6
  border_size = 2
  resize_on_border = false
  col.active_border = $color12
  col.inactive_border = $background
  layout = master
}

group {
  col.border_active = $color12

	groupbar {
	col.active = $color0
  }
}

decoration {
  rounding = 5
  active_opacity = 1.0
  inactive_opacity = 0.9
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.2
  dim_special = 0.8

    shadow {
    enabled = false
    range = 8
    render_power = 2
    color = $color12
    color_inactive = $color2
  }
  blur {
  enabled = false
  size = 8
  passes = 4
 noise= 0.0200
 #contrast= 1
 vibrancy = 0.25
 #vibrancy_darkness = 1.5
  #noise = 0.10
 # brightness= 0.90
  #xray = true
  ignore_opacity = true
  new_optimizations = true
  special = true
  popups = true
  }

}



$interval=2.6
$curve=easeOut


animations { 
  enabled = yes

  # bezier=NAME,X0,Y0,X1ou,Y1
  bezier = default, 0, 1, 0, 1
  bezier = wind, 0.05, 0.69, 0.1, 1
  bezier = winIn, 0.1, 1.1, 0.1, 1
  bezier = winOut, 0.3, 1, 0, 1
  bezier = linear, 1, 1, 1, 1

  bezier = easeOut, 0.16, 1, 0.3, 1

  # animation=NAME,ONOFF,SPEED,CURVE,STYLE
  animation = windows, 1, $interval, $curve, slide
  animation = windowsIn, 1, $interval, $curve, popin 90%
  animation = windowsOut, 1, $interval, $curve, popin 80%
  animation = windowsMove, 1, $interval, $curve, slide
  # animation = border, 1, 1, linear
  # animation = borderangle, 1, 180, linear, loop #used by rainbow borders and rotating colors
  animation = fade, 1, 3, default
  animation = workspaces, 1, 3, $curve, slide

  animation = layers, 1, 3, $curve, slide
  # animation = layersIn, 1, 10, default, slide
  # animation = layersOut, 1, 10, default, slide

}


input {
  kb_layout=us,gr
  kb_variant=
  kb_model=
  kb_options=grp:alt_shift_toggle
  kb_rules=
  repeat_rate=50
  repeat_delay=300
  numlock_by_default=1
  left_handed=0
  follow_mouse=1
  float_switch_override_focus=0

  sensitivity = 0.0
  numlock_by_default = true
  left_handed = false
  follow_mouse = true
  float_switch_override_focus = 2
  
  touchpad {
    disable_while_typing=1
    natural_scroll=1 
    clickfinger_behavior=0
    middle_button_emulation=1
    tap-to-click=1
    drag_lock=0
          }
}

# Gestures - New syntax in Hyprland 0.51+
# gesture = fingers, direction, action, options
gesture = 3, left, workspace, -1
gesture = 3, right, workspace, +1
gesture = 3, up, workspace, -1
gesture = 3, down, workspace, +1

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  # vfr = true
  vrr = 1
  mouse_move_enables_dpms = true
  enable_swallow = true
  swallow_regex = ^(kitty)$
  focus_on_activate = true
  #no_direct_scanout = true #for fullscreen games - deprecated
  initial_workspace_tracking = 0
  middle_click_paste = true
}

binds {
  workspace_back_and_forth=1
  allow_workspace_cycles=1
  pass_mouse_when_bound=0
}

#Could help when scaling and not pixelating
xwayland {
    force_zero_scaling = true
}
#layerrule = blur,waybar
#layerrule= blur,rofi
render {
  direct_scanout = 2 # auto: direct scanout only for fullscreen game content (lower latency)
}

cursor {
  no_hardware_cursors = false
  enable_hyprcursor = true
  warp_on_change_workspace = 1
  no_warps = false
}

