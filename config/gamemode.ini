; GameMode config — arch-station (Ryzen 5 7600 / RX 9060 XT)
; activated via `gamemoderun <game>` or Steam launch options: gamemoderun mangohud %command%

[general]
; governor is already `performance` system-wide, gamemode keeps it there
renice=10
softrealtime=auto
inhibit_screensaver=1

[gpu]
; push amdgpu to high dpm performance level while a game runs (card1)
apply_gpu_optimisations=accept-responsibility
gpu_device=1
amd_performance_level=high

[custom]
start=/home/akrvs/.config/gamemode/scripts/gamemode-start.sh
end=/home/akrvs/.config/gamemode/scripts/gamemode-end.sh
